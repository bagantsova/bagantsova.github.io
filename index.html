<style>
  :root{
    --bg:#f6f7f9;
    --bg-accent:#e8ecf2;
    --card:#ffffff;
    --card-border:rgba(15,23,42,.08);
    --fg:#0f172a;
    --muted:#5b6678;
    --rule:rgba(15,23,42,.08);
    --row:#ffffff;
    --row-border:rgba(15,23,42,.10);
    --row-hover:#f3f6fa;
    --accent:#0d9488;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 12px 32px -12px rgba(15,23,42,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1020;
      --bg-accent:#111a33;
      --card:#121a2e;
      --card-border:rgba(255,255,255,.08);
      --fg:#e8edf7;
      --muted:#9aa7bd;
      --rule:rgba(255,255,255,.09);
      --row:rgba(255,255,255,.035);
      --row-border:rgba(255,255,255,.09);
      --row-hover:rgba(255,255,255,.07);
      --accent:#5eead4;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 48px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1020;
    --bg-accent:#111a33;
    --card:#121a2e;
    --card-border:rgba(255,255,255,.08);
    --fg:#e8edf7;
    --muted:#9aa7bd;
    --rule:rgba(255,255,255,.09);
    --row:rgba(255,255,255,.035);
    --row-border:rgba(255,255,255,.09);
    --row-hover:rgba(255,255,255,.07);
    --accent:#5eead4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 48px -16px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  /* .unlock and .links set display:flex, which would otherwise beat [hidden] */
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 50% -10%, var(--bg-accent), transparent 70%),
      var(--bg);
    color:var(--fg);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 16px;
  }

  .card{
    width:100%;
    max-width:460px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:36px 28px 24px;
    text-align:center;
  }

  .avatar{
    width:76px;height:76px;
    margin:0 auto 18px;
    border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #334155));
    color:#06201c;
    font:700 27px/1 Georgia,"Times New Roman",serif;
    letter-spacing:.5px;
    user-select:none;
  }

  h1{
    margin:0;
    font-size:27px;
    font-weight:650;
    letter-spacing:-.02em;
  }
  .role{
    margin:7px 0 0;
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
  }
  .role b{color:var(--fg);font-weight:600}

  hr{border:0;border-top:1px solid var(--rule);margin:24px 0}

  .links{display:flex;flex-direction:column;gap:10px;text-align:left}

  .link{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    border:1px solid var(--row-border);
    border-radius:13px;
    background:var(--row);
    color:inherit;
    text-decoration:none;
    transition:background .15s ease, transform .15s ease, border-color .15s ease;
  }
  .link:hover{background:var(--row-hover);border-color:var(--accent);transform:translateY(-1px)}
  .link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .ico{flex:0 0 22px;width:22px;height:22px;color:var(--accent)}
  .ico svg{width:100%;height:100%;display:block;fill:currentColor}

  .txt{min-width:0}
  .label{display:block;font-size:15px;font-weight:600;line-height:1.2}
  .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
  .chev{margin-left:auto;color:var(--muted);flex:0 0 auto;opacity:.7}

  /* locked section */
  .vault{margin-top:10px;text-align:left}

  button.link{width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;border-style:dashed}
  button.link .ico{color:var(--muted)}
  button.link:hover .ico{color:var(--accent)}
  .vault[data-open="true"] button.link .chev{transform:rotate(90deg)}
  .chev{transition:transform .15s ease}

  .unlock{display:flex;gap:8px;margin-top:10px}
  .unlock input{
    flex:1;min-width:0;
    padding:11px 13px;
    border:1px solid var(--row-border);
    border-radius:11px;
    background:var(--row);
    color:var(--fg);
    font:inherit;font-size:14.5px;
  }
  .unlock input::placeholder{color:var(--muted)}
  .unlock input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .unlock button{
    padding:11px 16px;
    border:0;border-radius:11px;
    background:var(--accent);
    color:#06201c;
    font:inherit;font-weight:600;font-size:14.5px;
    cursor:pointer;white-space:nowrap;
  }
  .unlock button:disabled{opacity:.6;cursor:default}
  .unlock button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

  .err{margin:9px 2px 0;font-size:13px;color:#e11d48}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#fb7185}}
  :root[data-theme="dark"] .err{color:#fb7185}

  #private-links{margin-top:10px}

  .copy{
    margin:16px auto 0;
    display:inline-flex;align-items:center;gap:7px;
    background:none;border:0;padding:6px 10px;border-radius:8px;
    color:var(--muted);font:inherit;font-size:13px;cursor:pointer;
  }
  .copy:hover{color:var(--accent)}
  .copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  footer{margin-top:18px;color:var(--muted);font-size:12px}

  @media (max-width:420px){
    body{padding:28px 14px}
    .card{padding:30px 20px 20px;border-radius:18px}
    h1{font-size:24px}
  }
</style>

    var btn = document.getElementById('copy');
    var txt = document.getElementById('copy-text');
    var email = 'baganekcorp@gmail.com';
    var timer;
    btn.addEventListener('click', function () {
      var done = function () {
        txt.textContent = 'Copied';
        clearTimeout(timer);
        timer = setTimeout(function () { txt.textContent = 'Copy email address'; }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(done, fallback);
      } else {
        fallback();
      }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = email;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { txt.textContent = email; }
        document.body.removeChild(ta);
      }
    });
  })();
</script>

</body>
</html>
